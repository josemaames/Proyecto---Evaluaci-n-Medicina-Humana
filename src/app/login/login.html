<div class="login-container">
  <div class="login-card">
    <div class="header-login">
      <h1>Plataforma Integral de Gestión del Recurso Humano</h1>

      <p>PIGRH</p>
    </div>

    <form class="formulario" (ngSubmit)="login()">
      <label>N. de documento</label>

      <input
        type="text"
        placeholder="Ingrese su número de documento"
        [(ngModel)]="usuario"
        name="usuario"
      />

      <label>Contraseña</label>

      <div class="password-container">
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          placeholder="Ingrese su contraseña"
          [(ngModel)]="password"
          name="password"
        />

        <span class="mostrar" (click)="mostrarPassword = !mostrarPassword">
          {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
        </span>
      </div>

      <p class="error-login" *ngIf="mensajeError">
        {{ mensajeError }}
      </p>

      <button type="submit">Ingresar</button>
    </form>

    <div class="footer-login">
      <p>
        ¿No tienes una cuenta?
        <a>Regístrate aquí</a>
      </p>

      <hr />

      <p class="copyright">EsSalud - PIGRH</p>

      <a class="manual">Ver Manual de Usuario</a>
    </div>
  </div>
</div>
